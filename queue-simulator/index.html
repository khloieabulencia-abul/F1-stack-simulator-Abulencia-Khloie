<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Queue Data Structure Simulator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="container col-sm-8">

        <div class="row">
            <h1 class="display-7 p-3 mb-1 text-center text-bg-dark">
                Queue Data Structure Simulator
            </h1>
        </div>

        <div class="row text-bg-success p-3 mb-1">
            <div class="col text-center fs-4">Operations</div>
            <div class="col text-center fs-4">Queue Data</div>
            <div class="col text-center fs-4">Deleted from Queue</div>
        </div>

        <div class="row bg-danger">

            <div class="col bg-7B8FA1">
                <div class="d-grid gap-1 col mx-auto">

                    <input
                        type="text"
                        id="queue_data"
                        class="form-control text-center mt-2"
                        placeholder="Enter data"
                        aria-label="Queue data"
                    >

                    <button id="btn_enqueue" class="btn btn-success" type="button">
                        Enqueue
                    </button>

                    <button id="btn_dequeue" class="btn btn-danger" type="button">
                        Dequeue
                    </button>

                    <button id="btn_peek" class="btn btn-warning" type="button">
                        Peek
                    </button>

                    <button id="btn_clear" class="btn btn-light" type="button">
                        Clear
                    </button>

                </div>
            </div>

            <div class="col bg-dark p-2">
                <div class="text-center text-white mb-2">
                    <span class="badge bg-success">FRONT</span>
                    <span class="mx-3">Queue (Front → Rear)</span>
                    <span class="badge bg-warning text-dark">REAR</span>
                </div>

                <div id="queue" class="d-flex flex-wrap justify-content-center align-items-center gap-2">
                </div>
            </div>

            <div id="dequeued" class="col bg-9C254D">
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="stack.js"></script>

</body>
</html>
